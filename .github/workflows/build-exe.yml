name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install PyQt6 customtkinter PyMuPDF pdfplumber holidays watchdog pyinstaller dropbox requests

      - name: Sürüm Numarasını Güncelle
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION=$(git describe --tags --always --abbrev=0 2>/dev/null || echo "v1.0.0")-build.${GITHUB_RUN_NUMBER}
          fi
          echo "APP_VERSION = \"${VERSION}\"" > src/version.py

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name="FaturaTakip" --icon=icon.ico --add-data="icon.ico;." --collect-all pymupdf main.py

      - name: Otomatik Sürüm (Release) Yayınla
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.exe
          name: Fatura Takip ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}